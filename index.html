<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내가 로판 소설에 빙의되었다?! - 성격 테스트</title>
    <style>
        /* 로판 감성의 화려하고 유치 달달한 핑크/보라 테마 스타일링 */
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Hi+Melody&display=swap');

        :root {
            --primary-color: #ff7597;
            --secondary-color: #9b5de5;
            --gold-color: #ffd700;
            --bg-gradient: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 50%, #e8dbfc 100%);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Gowun Batang', serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            border: 4px double var(--gold-color);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1), inset 0 0 20px rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(5px);
            position: relative;
        }

        /* 반짝이 효과 장식 */
        .container::before, .container::after {
            content: '✨';
            position: absolute;
            font-size: 24px;
        }
        .container::before { top: 10px; left: 15px; }
        .container::after { bottom: 10px; right: 15px; }

        h1 {
            font-family: 'Hi Melody', cursive;
            font-size: 2.5rem;
            color: var(--secondary-color);
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(255, 117, 151, 0.3);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }

        .card {
            display: none;
        }

        .card.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background-color: #eee;
            border-radius: 6px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 25px;
            word-break: keep-all;
            color: #222;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #ffccd5;
            border-radius: 12px;
            padding: 15px 20px;
            font-family: 'Gowun Batang', serif;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .option-btn:hover {
            background: linear-gradient(90deg, #fff0f3, #f3e8ff);
            border-color: var(--primary-color);
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(255, 117, 151, 0.4);
        }

        /* 결과 창 스타일링 */
        .result-title {
            font-family: 'Hi Melody', cursive;
            font-size: 2.8rem;
            color: #ff1493;
            margin: 20px 0 10px 0;
            text-shadow: 2px 2px 0px var(--gold-color);
        }

        .result-img-box {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border: 5px dashed var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            font-size: 4rem; /* 일러스트 대신 귀여운 이모지로 대체 */
            box-shadow: 0 0 20px rgba(155, 93, 229, 0.2);
        }

        .result-analysis {
            text-align: left;
            background: rgba(255, 255, 255, 0.6);
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid var(--secondary-color);
            margin: 20px 0;
            line-height: 1.7;
            word-break: keep-all;
        }

        .start-btn, .restart-btn {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: 2px solid var(--gold-color);
            border-radius: 30px;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }

        .start-btn:hover, .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 213, 0, 0.6);
        }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen" class="card active">
        <h1>내가 로판 소설에 빙의되었다?!</h1>
        <p class="subtitle">"눈을 떠보니 내가 장미 왕국의 주인공?! 과연 나의 운명은..."</p>
        <div style="font-size: 5rem; margin: 20px;">👑✨🌹</div>
        <button class="start-btn" onclick="startTest()">빙의하러 가기</button>
    </div>

    <div id="test-screen" class="card">
        <div class="progress-bar">
            <div id="progress" class="progress"></div>
        </div>
        <div id="question-text" class="question-text">상황 질문이 들어갈 자리입니다.</div>
        <div id="options" class="options-container">
            </div>
    </div>

    <div id="result-screen" class="card">
        <p style="font-size: 1.2rem; font-weight: bold; color: var(--secondary-color); margin-bottom: 0;">나의 전생 유형은?</p>
        <div id="result-title" class="result-title">결과 타이틀</div>
        <div id="result-img" class="result-img-box">👸</div>
        <div id="result-analysis" class="result-analysis">결과 분석 내용이 들어갈 자리입니다.</div>
        <button class="restart-btn" onclick="restartTest()">다시 빙의하기 🔄</button>
    </div>
</div>

            desc: "<b>성격 분석:</b> 당신은 귀찮은 싸움과 권력 구도에 엮이는 것을 정말 싫어하는 평화주의자입니다. 소심해 보일 수 있지만, 위기 상황에서는 남들을 구하는 따뜻하고 단단한 내면을 가졌군요!<br><br><b>어울리는 삶:</b> 치열한 사교계 정치 싸움을 떠나, 신비로운 숲속 영지에서 힐링 물약을 만들며 조용히 사는 삶이 딱입니다. 하지만 당신의 맑고 순수한 능력 때문에 숨어 살아도 남주들이 자꾸 찾아와 집착할 운명이니 조심하세요!"
        },
        {
            min: 25, max: 36,
            title: "돈 많은 게 최고야! 갓생 사는 대상단주",
            emoji: "💰",
            desc: "<b>성격 분석:</b> 사랑이니 명예니 하는 것보다 내 통장의 잔고가 가장 중요한 현실주의자이자 실속파입니다. 비상한 두뇌와 계산 능력으로 손해 보는 장사는 절대 하지 않는 스타일!<br><br><b>어울리는 삶:</b> 현대 지식을 백분 활용해 사교계에 디저트나 뷰티 열풍을 일으키며 대륙 최고의 상단을 차릴 인물입니다. 황태자가 찾아와도 '바쁘니까 비즈니스 얘기 아니면 나가달라'고 쿨하게 문을 닫아버리는 멋진 갓생을 살게 될 것입니다."

    let currentIdx = 0;
    let totalScore = 0;

    function startTest() {
        document.getElementById("start-screen").classList.remove("active");
        document.getElementById("test-screen").classList.add("active");
        showQuestion();
    }

    function showQuestion() {
        if(currentIdx >= questions.length) {
            showResult();
            return;
        }

        // 진행바 업데이트
        const percent = (currentIdx / questions.length) * 100;
        document.getElementById("progress").style.width = percent + "%";

        // 질문 세팅
        const currentQ = questions[currentIdx];
        document.getElementById("question-text").innerText = `Q${currentIdx + 1}. ${currentQ.q}`;

        // 선택지 세팅 (5개 고정)
        const optionsDiv = document.getElementById("options");
        optionsDiv.innerHTML = ""; // 기존 버튼 초기화

        currentQ.a.forEach(answer => {
            const button = document.createElement("button");
            button.className = "option-btn";
            button.innerText = answer.text;
            button.onclick = () => {
                totalScore += answer.score;
                currentIdx++;
                showQuestion();
            };
            optionsDiv.appendChild(button);
        });
    }

    function showResult() {
        document.getElementById("test-screen").classList.remove("active");
        document.getElementById("result-screen").classList.add("active");

        // 점수 구간에 맞는 결과 찾기
        let finalResult = results[results.length - 1]; // 기본값 최고 점수
        for(let i=0; i<results.length; i++) {
            if(totalScore >= results[i].min && totalScore <= results[i].max) {
                finalResult = results[i];
                break;
            }
        }

        // 결과 화면에 데이터 매칭
        document.getElementById("result-title").innerHTML = finalResult.title;
        document.getElementById("result-img").innerText = finalResult.emoji;
        document.getElementById("result-analysis").innerHTML = `<b>누적 점수: ${totalScore}점</b><br><br>${finalResult.desc}`;
    }

    function restartTest() {
        currentIdx = 0;
        totalScore = 0;
        document.getElementById("result-screen").classList.remove("active");
        document.getElementById("start-screen").classList.add("active");
    }
</script>
